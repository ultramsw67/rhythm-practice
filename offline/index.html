<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>수드 리듬 연습</title>
<style>
  :root{--bg:#f3f6fc;--card:#fff;--ink:#1d2433;--sub:#4e586a;--line:#dbe3f0;--accent:#2b5fd9}
  @media (prefers-color-scheme: dark){:root{--bg:#131925;--card:#1b2332;--ink:#e8ecf4;--sub:#a9b3c4;--line:#2d3850;--accent:#8fb1ff}}
  body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
  main{max-width:520px;margin:0 auto;padding:40px 16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px 18px}
  h1{font-size:22px;margin:0 0 12px}
  p{margin:0 0 12px;color:var(--sub)}
  button{font:inherit;font-weight:700;width:100%;min-height:56px;border:0;border-radius:14px;background:var(--accent);color:#fff;cursor:pointer;margin-top:6px}
  #msg{margin-top:12px;min-height:1.6em;color:var(--ink)}
</style>
</head>
<body>
<main>
  <div class="card">
    <h1>오프라인 앱은 운영을 마쳤습니다</h1>
    <p>수드 리듬 연습은 카카오톡으로 받은 링크로 열어 주세요.</p>
    <p>이 앱에 녹음이 남아 있다면 아래 단추로 백업 파일을 받아 두세요. 카카오톡 링크로 연 앱에서 <b>보관함 → 백업 불러오기</b> 를 누르면 그대로 옮겨집니다.</p>
    <p>홈 화면에 이 앱 아이콘이 있다면 백업을 받은 뒤 아이콘을 길게 눌러 지워 주세요.</p>
    <button type="button" id="bak">⬇ 녹음 백업 받기</button>
    <div id="msg" role="status"></div>
  </div>
</main>
<script>
// 2026-10-08 "오프라인 앱은 내리고": 이미 설치된 오프라인 앱을 이 화면으로 바꾸고, 저장해 둔 앱 파일(캐시)·서비스워커를 지운다.
// 녹음(IndexedDB 'rhythm-practice')은 지우지 않는다 — 백업 파일 형식은 앱의 「전체 백업 내보내기」와 같다({app:'rhythm-practice', v:1, takes}).
(function () {
  var msg = document.getElementById('msg');
  function say(t) { msg.textContent = t; }
  try {
    if ('serviceWorker' in navigator) navigator.serviceWorker.getRegistrations().then(function (rs) { rs.forEach(function (r) { if (r.scope === new URL('./', location.href).href) r.unregister(); }); }).catch(function () { });
    if (window.caches) caches.keys().then(function (ks) { ks.forEach(function (k) { if (k.indexOf('rp-offline-') === 0) caches.delete(k); }); }).catch(function () { });
  } catch (e) { }
  function all() {
    return new Promise(function (res, rej) {
      if (!window.indexedDB) { res([]); return; }
      var rq = indexedDB.open('rhythm-practice');
      rq.onupgradeneeded = function () { var d = rq.result; if (!d.objectStoreNames.contains('takes')) d.createObjectStore('takes', { keyPath: 'id' }); };
      rq.onerror = function () { rej(rq.error); };
      rq.onsuccess = function () {
        var db = rq.result;
        try {
          var g = db.transaction('takes', 'readonly').objectStore('takes').getAll();
          g.onsuccess = function () { db.close(); res(g.result || []); };
          g.onerror = function () { db.close(); rej(g.error); };
        } catch (e) { db.close(); rej(e); }
      };
    });
  }
  function b64(blob) { return new Promise(function (res, rej) { var r = new FileReader(); r.onload = function () { res(String(r.result).split(',')[1]); }; r.onerror = function () { rej(r.error); }; r.readAsDataURL(blob); }); }
  document.getElementById('bak').onclick = function () {
    say('백업 파일을 만드는 중…');
    all().then(function (list) {
      if (!list.length) { say('이 앱에는 녹음이 없습니다. 백업할 것이 없으니 이 화면은 닫아도 됩니다.'); return; }
      var takes = [], i = 0, miss = 0;
      function next() {
        if (i >= list.length) {
          var d = new Date(), a = document.createElement('a');
          a.href = URL.createObjectURL(new Blob([JSON.stringify({ app: 'rhythm-practice', v: 1, takes: takes })], { type: 'application/json' }));
          a.download = '리듬연습 백업 ' + d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate() + '.json';
          document.body.appendChild(a); a.click(); setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
          say('녹음 ' + takes.length + '개를 백업 파일로 받았습니다.' + (miss ? ' (읽지 못한 ' + miss + '개는 빠졌습니다)' : ''));
          return;
        }
        var t = list[i++], rest = {}, k;
        for (k in t) if (k !== 'audio') rest[k] = t[k];
        var au = t.audio instanceof Blob ? t.audio : new Blob([t.audio || ''], { type: 'audio/wav' });
        b64(au).then(function (s) { rest.audio64 = s; takes.push(rest); next(); }).catch(function () { miss++; next(); });
      }
      next();
    }).catch(function () { say('녹음을 읽지 못했습니다. 이 화면을 닫았다가 다시 열어 보세요.'); });
  };
})();
</script>
</body>
</html>
